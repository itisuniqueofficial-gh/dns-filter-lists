name: Maintenance

# Scheduled integrity check. Periodically re-verifies that every source list
# is valid, free of duplicates, and produces a deterministic, complete build.
# Produces a report in the job summary and fails (alerting maintainers) if the
# repository has drifted into an invalid state.

on:
  schedule:
    - cron: "17 6 * * 1" # 06:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validation report
        run: node scripts/ci/report.js --summary

      - name: Unit tests
        run: node --test scripts/tests/*.test.js

      - name: Build
        run: node scripts/build.js

      - name: Verify expected artifacts exist
        run: node scripts/ci/verify-dist.js

      - name: Determinism check (rebuild is byte-identical)
        run: |
          node scripts/ci/hash-dist.js > first.sha
          node scripts/build.js >/dev/null
          node scripts/ci/hash-dist.js > second.sha
          if ! diff -q first.sha second.sha >/dev/null; then
            echo "::error::Build is not deterministic — dist/ differs between rebuilds."
            diff first.sha second.sha || true
            exit 1
          fi
          echo "Build is deterministic."
