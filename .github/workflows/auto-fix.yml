name: Auto-fix

# Applies ONLY deterministic, safe cleanup to a pull request's source lists:
# normalization (lowercase/trim/trailing-dot/LF), within-file deduplication and
# deterministic sorting — then commits the result to the PR branch.
#
# It never changes classification/semantics and never force-pushes.
#
# LOOP PREVENTION:
#   - Runs only for same-repo PRs (forks cannot be pushed to, and their token is
#     read-only) and only when the triggering actor is NOT the bot.
#   - The cleanup commit is pushed with the default GITHUB_TOKEN. GitHub does not
#     re-trigger workflows for GITHUB_TOKEN pushes, so no infinite loop occurs.
#     (To have the cleanup commit run its own checks, a maintainer may configure
#     a GitHub App/PAT — see CONTRIBUTING.md.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"

permissions:
  contents: write # required to push the cleanup commit to the PR branch

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize, deduplicate and sort (safe fixes only)
        run: node scripts/normalize-lists.js --write

      - name: Commit cleanup if anything changed
        run: |
          if git diff --quiet -- src; then
            echo "No cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: automatically normalize and deduplicate domain lists" \
            -m "Automated safe cleanup (normalization, within-file deduplication, sorting). No classification or semantic changes."
          git push
