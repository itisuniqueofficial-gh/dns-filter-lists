name: Validate

# Runs on every pull request. Validates changed source lists, detects
# duplicates and runs a full build test. A failure here blocks merging and
# therefore blocks deployment.
#
# SECURITY: the default GITHUB_TOKEN is read-only for pull requests from forks
# and no repository secrets are exposed to fork PRs. This workflow never runs
# contributor-provided scripts — it only runs the project's own Node scripts
# against the checked-out text files.
#
# Third-party actions are referenced by tag for readability. Maintainers are
# encouraged to pin them to immutable commit SHAs (see SECURITY.md).

on:
  pull_request:
    paths:
      - "src/**"
      - "config.js"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validation report
        id: checks
        continue-on-error: true
        run: node scripts/ci/report.js --comment ci-comment.md --summary

      - name: Unit tests
        run: node --test scripts/tests/*.test.js

      - name: Build test
        if: steps.checks.outcome == 'success'
        run: node scripts/build.js

      - name: Comment results on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Domain List Validation\n\nReport unavailable.';
            try { body = fs.readFileSync('ci-comment.md', 'utf8'); } catch {}
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- dns-filter-lists-validation -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Apply labels
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const labels = '${{ steps.checks.outputs.labels }}'.split(',').filter(Boolean);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const remove = ['validation-failed', 'duplicate'];
            for (const name of remove) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name }); } catch {}
            }
            if (labels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
            }

      - name: Fail if validation failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "Validation failed. See the PR comment for details."
          exit 1
