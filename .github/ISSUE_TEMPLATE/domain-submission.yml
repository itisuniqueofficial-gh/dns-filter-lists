name: Domain submission
description: Suggest domains to add to an existing category.
title: "[domains] <category>: <short summary>"
labels: [needs-review, list-update]
body:
  - type: markdown
    attributes:
      value: |
        The fastest way to contribute is a pull request editing
        `src/<category>/domains.txt`. Use this form if you prefer to submit
        domains for a maintainer to add.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - social
        - suspicious
        - ads
        - tracking
        - malware
        - phishing
        - other
    validations:
      required: true
  - type: textarea
    id: domains
    attributes:
      label: Domains
      description: One domain per line. No URLs, paths, ports or IP addresses.
      placeholder: |
        example.com
        sub.example.org
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Source / reason
      description: Why do these domains belong in this category?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: These are bare domains (no `http://`, paths, query strings or ports).
          required: true
        - label: They are not IP addresses.
          required: true
        - label: I checked they are not obvious duplicates of existing entries.
          required: true
