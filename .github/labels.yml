# Repository labels used by automation and triage.
# Create these in the repository (Issues → Labels), or apply with the GitHub
# CLI, e.g.:
#   gh label create validation-failed -c "#b60205" -d "Automated validation failed"
#
# The Validate workflow applies/removes `validation-failed` and `duplicate`
# automatically based on CI results.

- name: validation-failed
  color: "b60205"
  description: Automated validation failed; fixes required.

- name: duplicate
  color: "cccccc"
  description: Contains duplicate domain entries.

- name: needs-review
  color: "fbca04"
  description: Awaiting maintainer review.

- name: new-list
  color: "0e8a16"
  description: Adds a new category/list.

- name: list-update
  color: "1d76db"
  description: Updates domains in an existing list.

- name: documentation
  color: "5319e7"
  description: Documentation changes.

- name: security
  color: "d93f0b"
  description: Security-relevant change or report.
